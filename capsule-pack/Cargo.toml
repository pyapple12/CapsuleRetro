[package]
name = "capsule-pack"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
capsule-core = { path = "../capsule-core" }

[dev-dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
